services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cineverse_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/cineverse
      - JWT_SECRET=change_me_to_a_secure_production_secret_key_32_chars
      - JWT_EXPIRES_IN=30d
      - CLIENT_URL=http://localhost:5000
      - TMDB_API_KEY=${TMDB_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:6.0
    container_name: cineverse_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
