name: CineVerse CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs for the same branch or PR to conserve resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Lint, Test, Security & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies via Lockfile
        run: npm ci

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Static Configuration & Schema Sanity
        run: |
          test -f .env.example || { echo "Missing .env.example"; exit 1; }
          node -e "const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); if (!pkg.scripts.build || !pkg.scripts.test) process.exit(1);"

      - name: Execute Comprehensive Test Suite (Suites 1-10)
        env:
          PORT: 5000
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/cineverse_ci_test
          JWT_SECRET: ci_pipeline_super_secret_jwt_key_2026_test_only
          DISABLE_RATE_LIMIT: 'true'
        run: npm test

      - name: Build Frontend Production Assets
        run: npm run build

      - name: Verify Build Artifact Integrity
        run: |
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          test -d dist/assets || { echo "Missing dist/assets"; exit 1; }
          echo "Client production bundle verified successfully!"
