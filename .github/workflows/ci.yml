name: CineVerse CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Test Suite (Phases 2-6)
        env:
          PORT: 5000
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/cineverse_test
          JWT_SECRET: test_jwt_super_secret_pipeline_key_12345
          DISABLE_RATE_LIMIT: 'true'
        run: npm test

      - name: Build Frontend Production Bundle
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || exit 1
          echo "Production build verified successfully!"
